name: Android Test APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "android/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JS 打包工具
        run: npm install

      - name: 运行游戏底层测试
        run: npm test

      - name: 打包安卓游戏 JS
        run: npm run build:android-js

      - name: 复制游戏图片资源
        run: |
          mkdir -p android/app/src/main/assets/assets
          if [ -d "assets" ]; then
            cp -R assets/. android/app/src/main/assets/assets/
          fi

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 34
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 编译 APK
        run: gradle -p android assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: city-restaurant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
