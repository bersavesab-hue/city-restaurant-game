name: Apply Update ZIP

on:
  push:
    branches:
      - main
    paths:
      - update.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail
          test -f update.zip
          if unzip -Z1 update.zip | grep -Eq '(^/|(^|/)\.\.(/|$)|^\.git/)'; then
            echo "Unsafe path found in update.zip"
            exit 1
          fi

      - name: Apply update
        shell: bash
        run: |
          set -euo pipefail
          unzip -o update.zip -x '.git/*' '.github/workflows/apply-update.yml'
          rm -f update.zip

      - name: Commit updated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 0
          fi
          git commit -m "Apply one-click update package"
          git push origin main
