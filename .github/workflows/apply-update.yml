name: Apply Update ZIP

on:
  push:
    branches:
      - main
    paths:
      - update.zip

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: city-restaurant-one-click-update
  cancel-in-progress: false

jobs:
  apply-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          test -f update.zip

          if unzip -Z1 update.zip | grep -Eq '(^/|(^|/)\.\.(/|$)|^\.git/)'; then
            echo "Unsafe path found in update.zip"
            exit 1
          fi

          if unzip -Z1 update.zip | grep -Eq '^\.github/workflows/'; then
            echo "ERROR: update.zip 不允许修改 GitHub workflow"
            exit 1
          fi

          if unzip -Z1 update.zip | grep -Eq '^package\.json$'; then
            echo "ERROR: update.zip 不允许直接覆盖 package.json"
            echo "版本修改必须通过 scripts/apply-update-patch.js 增量完成"
            exit 1
          fi

      - name: Apply update to workspace
        shell: bash
        run: |
          set -euo pipefail

          unzip -o update.zip \
            -x '.git/*' \
            '.github/workflows/*' \
            'package.json'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply incremental patch
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/apply-update-patch.js ]; then
            node scripts/apply-update-patch.js
            rm -f scripts/apply-update-patch.js
          else
            echo "No incremental patch script."
          fi

      - name: Protect workflow files
        shell: bash
        run: |
          set -euo pipefail

          git restore .github/workflows 2>/dev/null || true

      - name: Install JavaScript dependencies
        run: npm install

      - name: Run all game tests
        run: npm test

      - name: Build Android game JavaScript
        run: npm run build:android-js

      - name: Copy game image assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app/src/main/assets/assets

          if [ -d "assets" ]; then
            rm -rf android/app/src/main/assets/assets/*
            cp -R assets/. android/app/src/main/assets/assets/
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Remove update package before commit
        shell: bash
        run: |
          set -euo pipefail

          rm -f update.zip

      - name: Final workflow protection
        shell: bash
        run: |
          set -euo pipefail

          git restore .github/workflows 2>/dev/null || true

      - name: Commit validated update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git reset .github/workflows 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 0
          fi

          git commit -m "Apply validated one-click update"
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-restaurant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
