name: Apply Update ZIP

on:
  push:
    branches:
      - main
    paths:
      - update.zip
      - .github/workflows/apply-update.yml

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: city-restaurant-one-click-update
  cancel-in-progress: false

jobs:
  apply-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail
          test -f update.zip

          if unzip -Z1 update.zip | grep -Eq '(^/|(^|/)\.\.(/|$)|^\.git/)'; then
            echo "Unsafe path found in update.zip"
            exit 1
          fi

      - name: Apply update to workspace
        shell: bash
        run: |
          set -euo pipefail
          unzip -o update.zip -x '.git/*' '.github/workflows/apply-update.yml'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JavaScript dependencies
        run: npm install

      - name: Install persistent V0.8.2 generated-syntax repair
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/repair-v082-generated.js <<'JS'
          'use strict';

          const fs = require('fs');
          const cp = require('child_process');

          const target = 'src/operations/restaurantSimulationV081.js';

          if (!fs.existsSync(target)) {
            throw new Error('V0.8.2 repair target missing: ' + target);
          }

          let source = fs.readFileSync(target, 'utf8');

          // V0.8.2 installer may leave a duplicated closing brace directly
          // before function update(). Repair only that exact boundary.
          const bad = '\n}}\n\nfunction update(';
          const good = '\n}\n\nfunction update(';

          const count = source.split(bad).length - 1;

          if (count > 1) {
            throw new Error(
              'V0.8.2 repair refused: duplicated-brace boundary appeared '
              + count
              + ' times.'
            );
          }

          if (count === 1) {
            source = source.replace(bad, good);
            fs.writeFileSync(target, source, 'utf8');
            console.log(
              '[V0.8.2 repair] Removed duplicated closing brace before update().'
            );
          } else {
            console.log(
              '[V0.8.2 repair] No duplicated closing brace found; checking syntax.'
            );
          }

          const result = cp.spawnSync(
            process.execPath,
            ['--check', target],
            {
              encoding: 'utf8'
            }
          );

          if (result.status !== 0) {
            process.stderr.write(result.stdout || '');
            process.stderr.write(result.stderr || '');
            throw new Error(
              'V0.8.2 generated restaurant simulation still has invalid syntax.'
            );
          }

          console.log('[V0.8.2 repair] restaurantSimulationV081.js syntax PASS');
          JS

          node - <<'JS'
          const fs = require('fs');

          const path = 'package.json';
          const pkg = JSON.parse(
            fs.readFileSync(path, 'utf8')
          );

          const marker =
            'node scripts/apply-v082-live-restaurant.js';

          const repair =
            'node scripts/repair-v082-generated.js';

          if (
            typeof pkg.scripts?.pretest !== 'string'
          ) {
            throw new Error(
              'package.json scripts.pretest missing'
            );
          }

          if (
            !pkg.scripts.pretest.includes(repair)
          ) {
            if (
              !pkg.scripts.pretest.includes(marker)
            ) {
              throw new Error(
                'V0.8.2 pretest marker not found'
              );
            }

            pkg.scripts.pretest =
              pkg.scripts.pretest.replace(
                marker,
                marker + ' && ' + repair
              );

            fs.writeFileSync(
              path,
              JSON.stringify(
                pkg,
                null,
                2
              ) + '\n',
              'utf8'
            );

            console.log(
              '[V0.8.2 repair] Persistent repair inserted into pretest.'
            );
          } else {
            console.log(
              '[V0.8.2 repair] Persistent pretest repair already present.'
            );
          }
          JS

      - name: Run all game tests
        run: npm test

      - name: Build Android game JavaScript
        run: npm run build:android-js

      - name: Copy game image assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app/src/main/assets/assets

          if [ -d "assets" ]; then
            rm -rf android/app/src/main/assets/assets/*
            cp -R assets/. android/app/src/main/assets/assets/
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Remove update package before commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f update.zip

      - name: Commit validated update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 0
          fi

          git commit -m "Apply validated one-click update"
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-restaurant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
