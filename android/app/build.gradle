plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cityrestaurant.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cityrestaurant.game'

        minSdk 23
        targetSdk 34

        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}

/**
 * GitHub 的一键更新工作流会先把整个 assets/ 复制到 Android assets。
 * 打包前只清理“设计参考大图”，保留真正运行时图片。
 */
def prepareRuntimeAssetsTask = tasks.register('prepareRuntimeAssets') {
    doLast {
        def runtimeRoot = file('src/main/assets/assets')

        // 这些整张大效果图和原始大图只留仓库，不进入 APK。
        delete file("${runtimeRoot}/images/generated")
        delete file("${runtimeRoot}/images/map/city_base_01.png")

        println "Runtime asset filter applied. Runtime images retained; large design references removed."
    }
}

tasks.matching { task ->
    task.name == 'preBuild'
}.configureEach {
    dependsOn prepareRuntimeAssetsTask
}
