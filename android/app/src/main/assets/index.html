<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             minimum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>城市餐饮创业</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #F3EBDD;

      touch-action: none;

      -webkit-user-select: none;
      user-select: none;
    }

    #gameCanvas {
      display: block;

      width: 100vw;
      height: 100vh;

      margin: 0;
      padding: 0;

      background: #F3EBDD;
    }

    #errorBox {
      display: none;

      position: fixed;

      left: 16px;
      right: 16px;
      top: 16px;

      z-index: 9999;

      padding: 14px;

      border-radius: 10px;

      background: #7A2727;
      color: #FFFFFF;

      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;

      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <canvas id="gameCanvas"></canvas>

  <div id="errorBox"></div>

  <script>
    window.addEventListener(
      'error',
      function (event) {
        const box =
          document.getElementById(
            'errorBox'
          );

        box.style.display =
          'block';

        const detail =
          event &&
          event.error &&
          (
            event.error.stack ||
            event.error.message
          ) ||
          event.message ||
          '未知脚本异常';

        box.textContent =
          '游戏运行错误：\n' +
          detail +
          '\n\n' +
          (
            event.filename ||
            ''
          ) +
          ':' +
          (
            event.lineno ||
            ''
          );
      }
    );
  </script>

  <script src="game.bundle.js"></script>

</body>
</html>
